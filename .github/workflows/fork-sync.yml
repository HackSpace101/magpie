# Keeps this private fork's main up to date with yetone/magpie's main,
# with no token of yours: only the built-in GITHUB_TOKEN.
#
# On a schedule (and by hand) .fork/sync.sh makes one commit on top of
# main whose tree is upstream's main, less upstream's .github, plus the
# paths this fork owns (.fork/owned). That commit never touches a
# workflow file, which is the one thing GITHUB_TOKEN may not push, and
# can't conflict. The job checks it builds and the fork's change still
# holds, then pushes it. A failed check pushes nothing and opens (or
# comments on) an issue labelled fork-sync, so main is never left broken.
# See docs/fork/README.md.
name: Fork sync

on:
  schedule:
    # every 6 hours, at minute 17 (UTC)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/yetone/magpie.git
  UPSTREAM_BRANCH: main
  BRANCH: main

jobs:
  sync:
    # never in upstream itself
    if: github.repository != 'yetone/magpie'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Make the sync commit
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # upstream's tags stay out: they aren't this repo's
          git fetch --no-tags --depth 1 "$UPSTREAM_URL" "$UPSTREAM_BRANCH"
          up=$(git rev-parse FETCH_HEAD)
          echo "upstream=$up" >> "$GITHUB_OUTPUT"
          commit=$(.fork/sync.sh "$up")
          if [ -z "$commit" ]; then
            echo "main is at upstream ${up:0:12} already; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git checkout -q "$commit"
          git log --stat --format='%H%n%B' -1 | tail -n 40

      - uses: actions/setup-go@v5
        if: steps.sync.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the sync commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          go vet -tags nogui ./internal/plugin
          CGO_ENABLED=0 go build -tags nogui -o /dev/null .
          # the fork's change: the plugin host's raised stream limit
          go test -tags nogui -count=1 \
            -run 'TestForkStreams|TestForkHostTakesMoreThanUpstreamsStreams|TestHostAdmissionLimitFailsTheNewCall|TestHostFetchWaitsForAStreamWindow' \
            ./internal/plugin
          # the Docker deploy's Caddy lets the gateway's client routes past
          # the web UI's password: its list must still be upstream's routes
          go test -tags nogui -count=1 -run '^TestForkCaddyClientPaths$' ./internal/gateway

      - name: Push
        if: steps.sync.outputs.changed == 'true'
        env:
          COMMIT: ${{ steps.sync.outputs.commit }}
        run: git push origin "$COMMIT:refs/heads/$BRANCH"

      - name: Report a failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream }}
        run: |
          set -uo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Upstream: yetone/magpie@${UPSTREAM_SHA:-unknown}"$'\n'"Run: $run_url"$'\n\n'"Making the sync commit, its checks or the push failed; see the run's log. Nothing was pushed; main is as it was. See docs/fork/README.md, \"同步失败怎么办\", then run Fork sync again."
          gh label create fork-sync --color B60205 --description "Fork sync with upstream failed" --force >/dev/null 2>&1 || true
          open=$(gh issue list --label fork-sync --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Fork sync with upstream failed" --label fork-sync --body "$body"
          fi
